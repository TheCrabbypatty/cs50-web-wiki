{% extends "encyclopedia/layout.html" %}

{% block title %}
    Edit Page
{% endblock %}

{% block body %}
    <h3>You are editing the content of {{ title }}</h3>
    <form action = "{% url 'edit_page' title %}" method = "POST">
        {% csrf_token %}
        <textarea rows="3" cols="10" name = "content" > 
            {{ original }}
        </textarea>
        <input type = "submit" value = "Save">
    </form>
{% endblock %}
